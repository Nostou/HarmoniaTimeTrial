<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: monospace; padding: 10px; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 2px 8px; }
    .nita-cell { visibility: hidden; }

    .btn {
      padding: 7px 18px;
      border: none;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.8; }

    .btn-valider {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: #4a86e8;
      color: white;
      font-weight: bold;
    }

    .btn-bar {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 12px;
    }

    .btn-copier {
      background: #57bb8a;
      color: white;
      font-weight: bold;
    }

    .btn-fermer {
      background: #e06666;
      color: white;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <table id="tracks"></table>
  <button class="btn btn-valider" onclick="valider()">Valider ✓</button>

  <script>
    const TRACKS = [
      "01 - MBC", "02 - CC", "03 - WS", "04 - DKS", "05 - rDH",
      "06 - rSGB", "07 - rWS", "08 - rAF", "09 - rDKP", "10 - SP",
      "11 - rSHS", "12 - rWSh", "13 - rKTB", "14 - FO", "15 - PS",
      "16 - rPB", "17 - SSS", "18 - rDDJ", "19 - GBR", "20 - CCF",
      "21 - DD", "22 - BCi", "23 - DBB", "24 - rMMM", "25 - rCM",
      "26 - rTF", "27 - BC", "28 - AH", "29 - rMC", "30 - RR"
    ];

    const table = document.getElementById("tracks");
    TRACKS.forEach((track, i) => {
      const tr = document.createElement("tr");
      tr.innerHTML = 
        '<td><input type="checkbox" id="track'+i+'" value="'+i+'" onchange="toggleNita('+i+')"> ['+track+']</td>' +
        '<td class="nita-cell" id="nitaCell'+i+'"><input type="checkbox" id="nita'+i+'" value="'+i+'"> NITA ?</td>';
      table.appendChild(tr);
    });

    function toggleNita(i) {
      const cb = document.getElementById("track" + i);
      const nitaCell = document.getElementById("nitaCell" + i);
      const nitaCb = document.getElementById("nita" + i);
      nitaCell.style.visibility = cb.checked ? "visible" : "hidden";
      if (!cb.checked) nitaCb.checked = false;
    }

    function valider() {
      const selected = [];
      const nita = [];
      for (let i = 0; i < 30; i++) {
        const cb = document.getElementById("track" + i);
        const cbNita = document.getElementById("nita" + i);
        if (cb && cb.checked) selected.push(i);
        if (cbNita && cbNita.checked) nita.push(i);
      }
      google.script.run.withSuccessHandler(ShowMarkdown).CreateTracksMarkdown(selected, nita);
    }

    function ShowMarkdown(markdown) {
      const escaped = JSON.stringify(markdown);
      document.body.innerHTML =
        '<div style="padding-bottom:50px;">' +
        '<pre style="font-size:11px;white-space:pre-wrap;">' + markdown + '</pre>' +
        '</div>' +
        '<div class="btn-bar">' +
        '<button class="btn btn-copier" onclick=\'navigator.clipboard.writeText(' + escaped + ')\'>⎘ Copier</button>' +
        '<button class="btn btn-fermer" onclick="google.script.host.close()">✕ Fermer</button>' +
        '</div>';
    }
  </script>
</body>
</html>
