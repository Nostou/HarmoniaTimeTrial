<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    :root {
      --blue: #4a86e8;
      --green: #57bb8a;
      --border: #d9d9d9;
      --muted: #666;
    }

    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 18px;
      color: #222;
      font-size: 13px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 90px;
      min-height: 30px;
      padding: 4px 7px;
      border: 1px solid #b7b7b7;
      border-radius: 4px;
      font: inherit;
    }

    .hint { margin: 12px 0 18px; color: var(--muted); }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 8px 12px;
      background: var(--green);
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .65; cursor: default; }
    progress { width: 110px; height: 30px; }
    .status {
      min-height: 20px;
      margin-top: 14px;
      white-space: pre-wrap;
    }

    .status.error { color: #b00020; }
    .status.success { color: #137333; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <label>
    Tables to ignore from the beginning
    <input id="ignoredTables" type="number" min="0" value="0">
  </label>

  <p id="tableInfo" class="hint"></p>

  <div class="actions">
    <button id="refreshButton">Refresh</button>
    <progress id="progress" class="hidden"></progress>
  </div>

  <p id="status" class="status"></p>

  <script>
    const $ = id => document.getElementById(id);

    function runServer(method, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error.message || String(error))));
        runner[method](...args);
      });
    }

    function setStatus(message, type) {
      const status = $("status");
      status.textContent = message || "";
      status.className = "status" + (type ? " " + type : "");
    }

    async function loadOptions() {
      try {
        const options = await runServer("getRefreshMapOptions");
        $("ignoredTables").value = options.defaultIgnoredTables;
        $("ignoredTables").max = options.tableCount;
        $("tableInfo").textContent = `${options.tableCount} table(s) detected.`;
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    async function refresh() {
      const ignoredTables = Number($("ignoredTables").value);
      $("refreshButton").disabled = true;
      $("progress").classList.remove("hidden");
      setStatus("");

      try {
        const result = await runServer("refreshMapChances", ignoredTables);
        setStatus(
          `Map percentages refreshed using ${result.tableCount - result.ignoredTables} table(s).`,
          "success"
        );
      } catch (error) {
        setStatus(error.message, "error");
      } finally {
        $("refreshButton").disabled = false;
        $("progress").classList.add("hidden");
      }
    }

    $("refreshButton").addEventListener("click", refresh);
    loadOptions();
  </script>
</body>
</html>
